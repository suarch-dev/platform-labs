apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: exam-route
  namespace: exam-app
spec:
  parentRefs:
  - name: my-gateway
    namespace: nginx-gateway
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: exam-service
      port: 80
